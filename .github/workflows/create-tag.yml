name: Create Tag

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  create:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          startsWith(github.event.workflow_run.head_commit.message, 'bump version to ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.WF_TOKEN }}

      - name: Tag new version
        shell: bash
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SUBJECT="$(printf '%s' "$MESSAGE" | head -n1)"

          if [ "$SUBJECT" != "bump version to $VERSION" ]; then
            echo "Commit message does not match package.json version $VERSION" >&2
            exit 1
          fi

          git tag "v$VERSION"
          git push origin "v$VERSION"
